<!doctype html><html lang="ja"><meta charset="utf-8"><title>Marq｜端末動作確認</title><link rel="stylesheet" href="style.css"><main style="display:block;padding:24px"><h1>端末動作確認</h1><p>この端末で本体画面を操作して検証します。「端末テスト」という独立案件を一件作成します。外部APIは呼び出しません。</p><button id="run">検証を開始</button><pre id="out"></pre><iframe title="検証対象" src="/" style="width:100%;height:650px;border:1px solid #bbb"></iframe></main><script type="module">
const log=document.querySelector('#out'),frame=document.querySelector('iframe'),wait=t=>new Promise(r=>setTimeout(r,t));
const until=async(fn,ms=30000)=>{const end=Date.now()+ms;while(!fn()){if(Date.now()>end)throw Error('timeout');await wait(100)}};
document.querySelector('#run').onclick=async e=>{e.target.disabled=true;log.textContent=navigator.userAgent+'\n';const doc=frame.contentDocument,q=s=>doc.querySelector(s),ok=s=>log.textContent+='PASS '+s+'\n';
try{
await until(()=>q('#metric strong'));ok('初期の排板');q('#name').value='端末テスト '+new Date().toISOString();q('#name').dispatchEvent(new Event('change'));
q('#mode').value='wave';q('#calc').click();await until(()=>q('#metric strong').textContent==='C');ok('縦貼ソルバー');
q('[data-view=scene]').click();await until(()=>q('#viewport canvas'));ok('3D キャンバス');q('#az').value='125';q('#az').dispatchEvent(new Event('input'));ok('方向光入力');
q('#save').click();await until(()=>q('#version').textContent.includes('draft'));ok('版を保存');q('[data-view=review]').click();
for(const kind of ['glb','xlsx','dxf']){q('[data-export='+kind+']').click();await until(()=>q('#jobs').textContent.includes(kind.toUpperCase()+' · r1 · ready'));ok(kind+' ジョブ')}
log.textContent+='完了。GPU表示と色の目視確認は下の画面で行ってください。';
}catch(err){log.textContent+='未完了 '+err.message+' '+q('#status')?.textContent}finally{e.target.disabled=false}};
</script></html>
