<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marq｜外装設計ワークベンチ</title>
<link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<header><strong>Marq<span> / M.A.D.E.</span></strong><span>外装設計ワークベンチ 3.1.1</span><div><a href="field-guide.html" target="_blank" rel="noopener">実務操作ガイド</a><button id="projectList">案件を開く</button><button id="save" class="ink">版を保存</button></div></header>
<main><aside><small>PROJECT</small><input id="name" aria-label="案件名"><label>用途・工法</label><div class="pair"><select id="stock"><option value="dry">ドライ</option><option value="cs">冷凍冷蔵</option></select><select id="mode"><option value="H">横貼・公式配列</option><option value="V">縦貼・公式配列</option><option value="wave">縦貼・波形</option></select></div>
<label>働き幅 mm<input id="pitch" type="number" min="1"></label><label>各階高 mm（1階から）<input id="floors"></label><label>立面<select id="face"></select></label><label>実柱スパン mm（左から）<input id="spans"></label><label>パラペット高 mm<input id="parapet" type="number" min="0"></label><label>配列起点<select id="scan"><option value="auto">ロゴ位置より自動</option><option value="left">左上</option><option value="right">右上</option></select></label><label>波形<select id="wave"><option value="234565432">山並み</option><option value="234323432">双峰</option><option value="654323456">鞍型</option><option value="234555432">台地</option><option value="234567">尾根</option></select></label><label class="check"><input type="checkbox" id="tenant">入居企業ロゴ横並び</label><label>この面のアクセント上限 %<input id="limit" type="number" min="0" max="100" placeholder="未指定"></label><button id="calc" class="blue">割付を計算</button>
<details><summary>図面・モデル</summary><label>FBX / GLB を追加<input id="model" type="file" accept=".fbx,.glb"></label><button id="sampleModel">building01 を表示</button><button id="bind">3Dで面の基準点を指定</button><label>立面の参考図<input id="ref" type="file" accept="image/*"></label><button id="outline">輪郭を点で入力</button><button id="finishOutline">輪郭を確定</button></details>
<details><summary>ルールと設計条件</summary><label>位図バージョン<select id="rules"><option value="p18-baseline">2.0 / P.18 照合用</option><option value="word-comparison">提案書 C4・C6 比較用</option></select></label><label>シード<input id="seed" type="number"></label><label>設計意図<textarea id="intent" rows="3"></textarea></label><button id="intentApply">意図から候補を作る</button><button id="aiText">AIに設計意図を相談</button><label class="check"><input id="consent" type="checkbox">設定済みゲートウェイへの送信を許可</label></details>
<details><summary>案件データ・旧版の取込</summary><button id="jsonOut">工程 JSON 保存</button><input id="jsonIn" type="file" accept=".json"><button id="edit">詳細条件 JSON を編集</button><button id="spaces">外構・内装チェック</button></details></aside>
<section class="work"><div class="headline"><div><small>FACADE DESIGN</small><h1>立面を設計する</h1></div><span id="version">未保存</span></div>
<nav><button data-view="elevation" class="active">展開立面</button><button data-view="scene">全周 3D</button><button data-view="photo">実景合成</button><button data-view="review">比較・出力（CAD／BOM）</button></nav>
<section id="elevation" class="page"><div class="tools"><select id="brush"><option value="inspect">板を照会</option><option value="opening">窓・扉を切抜</option><option value="entrance">入口</option><option value="band">連窓・局部シフト</option><option value="smoke">排煙窓・板を銀色</option><option value="future">将来開口</option><option value="equipment">設備・外階段</option><option value="logo">ブランドロゴ</option><option value="return">雁行小面</option><option value="notch">切り欠き</option><option value="ramp">ランプ腰壁</option><option value="road">軒下車路</option><option value="column">柱</option><option value="berth">バース</option><option value="slope">斜路切欠</option></select><button id="undo">戻す</button><button id="png">立面 PNG</button></div><canvas id="plan" width="1400" height="570"></canvas><output id="inspect">板をクリックすると、板番号・面積・適用ルールを表示します。</output></section>
<section id="scene" class="page" hidden><div id="viewport"></div><div class="tools"><label>環境 <select id="sky"><option value="day">昼</option><option value="dusk">夕景</option><option value="night">夜景</option></select></label><label>環境光<input type="range" id="ambient" min="0" max="5" step=".1"></label><label>方位<input type="range" id="az" min="0" max="360"></label><label>高度<input type="range" id="alt" min="3" max="88"></label><label class="check"><input type="checkbox" id="shadow" checked>影</label><button id="snap">視点 PNG</button></div></section>
<section id="photo" class="page" hidden><label>計画地の空撮・街並み写真<input id="background" type="file" accept="image/*"></label><canvas id="composition" width="1440" height="810"></canvas><div class="tools"><label>位置 X<input id="cx" type="range" min="-70" max="70" value="0"></label><label>位置 Y<input id="cy" type="range" min="-70" max="70" value="0"></label><label>縮尺 %<input id="scale" type="range" min="10" max="200" value="75"></label><button id="compose">現在の視点で合成</button><button id="aiImage">建物を固定して空撮をAI合成</button><button id="photoOut">合成 PNG</button></div></section>
<section id="review" class="page" hidden><h2>設計レビュー</h2><div id="history"></div><div class="tools"><button id="submit">照査に回す</button><button id="approve">承認を記録</button><button id="compare">選択版と編集中の案を比較</button></div><output id="diff"></output><h2>同じ版から出力</h2><div class="tools"><button data-export="cadbom">割付図 DXF ＋ 推奨3社 BOM 一括出力</button><button data-export="dxf">立面 DXF</button><button data-export="xlsx">推奨3メーカー BOM（Excel）</button><button data-export="glb">実寸 GLB</button><button data-export="cg">8K CG 制作依頼</button></div><div id="jobs"></div><button id="refresh">履歴を更新</button><details><summary>案件メンバー・監査履歴</summary><button id="member">メンバーを追加</button><pre id="audit"></pre></details></section>
<div id="metric"></div><div class="explain"><h2>設計の意図</h2><p id="meaning"></p></div><div id="status" role="status" aria-live="polite"></div></section></main>
<dialog><form method="dialog"><h2 id="dialogTitle"></h2><div id="dialogContent"></div><div class="tools"><button value="cancel">閉じる</button><button id="confirm" class="ink" value="ok">適用</button></div></form></dialog><script type="module" src="ui.js"></script></html>
